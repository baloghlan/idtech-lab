apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: argocd-demo
  labels:
    app.kubernetes.io/name: demo-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: demo-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
- name: Deploy NFS dynamic provisioner
  hosts: k8s_master
  become: true

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    chart_version: "4.0.18"

  tasks:
    - name: Copy Helm values to master
      ansible.builtin.copy:
        src: ../../k8s/storage/nfs-provisioner-values.yaml
        dest: /tmp/nfs-provisioner-values.yaml
        mode: "0644"

    - name: Deploy NFS provisioner using Helm
      kubernetes.core.helm:
        name: nfs-subdir-external-provisioner
        chart_ref: nfs-subdir-external-provisioner
        chart_repo_url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
        chart_version: "{{ chart_version }}"
        release_namespace: nfs-provisioner
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        values_files:
          - /tmp/nfs-provisioner-values.yaml
        wait: true
        timeout: 5m
        state: present
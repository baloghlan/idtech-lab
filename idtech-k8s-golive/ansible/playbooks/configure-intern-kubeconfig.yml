- name: Configure intern Kubernetes credentials
  hosts: k8s_master
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /opt/ansible-k8s-venv/bin/python
    kubeconfig_path: /etc/kubernetes/admin.conf
    intern_cert_dir: /etc/kubernetes/intern
    intern_csr_name: intern-client
    intern_kubeconfig: "{{ intern_cert_dir }}/intern.kubeconfig"

  tasks:
    - name: Read issued client certificate
      kubernetes.core.k8s_info:
        api_version: certificates.k8s.io/v1
        kind: CertificateSigningRequest
        name: "{{ intern_csr_name }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: intern_csr

    - name: Ensure certificate was issued
      ansible.builtin.assert:
        that:
          - intern_csr.resources | length == 1
          - intern_csr.resources[0].status.certificate is defined
          - intern_csr.resources[0].status.certificate | length > 0

    - name: Save signed client certificate
      ansible.builtin.copy:
        content: "{{ intern_csr.resources[0].status.certificate | b64decode }}"
        dest: "{{ intern_cert_dir }}/intern.crt"
        owner: root
        group: root
        mode: "0644"

    - name: Read cluster connection configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - config
          - view
          - --kubeconfig={{ kubeconfig_path }}
          - --raw
          - -o
          - json
      register: cluster_config
      changed_when: false
      no_log: true

    - name: Generate intern kubeconfig
      ansible.builtin.copy:
        dest: "{{ intern_kubeconfig }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: idtech-cluster
              cluster:
                server: {{ (cluster_config.stdout | from_json).clusters[0].cluster.server }}
                certificate-authority: /etc/kubernetes/pki/ca.crt
          users:
            - name: intern
              user:
                client-certificate: {{ intern_cert_dir }}/intern.crt
                client-key: {{ intern_cert_dir }}/intern.key
          contexts:
            - name: intern@idtech-cluster
              context:
                cluster: idtech-cluster
                user: intern
                namespace: idtech-backend
          current-context: intern@idtech-cluster
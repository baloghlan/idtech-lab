- name: Install Flannel CNI
  hosts: k8s_master
  become: true
  gather_facts: false

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    flannel_manifest_url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

  tasks:
    - name: Download Flannel manifest
      ansible.builtin.get_url:
        url: "{{ flannel_manifest_url }}"
        dest: /tmp/kube-flannel.yml
        mode: "0644"

    - name: Install Flannel
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/kube-flannel.yml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: flannel_apply
      changed_when: >-
        'created' in flannel_apply.stdout or
        'configured' in flannel_apply.stdout

    - name: Wait for Flannel DaemonSet rollout
      ansible.builtin.command:
        cmd: kubectl rollout status daemonset/kube-flannel-ds -n kube-flannel --timeout=180s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
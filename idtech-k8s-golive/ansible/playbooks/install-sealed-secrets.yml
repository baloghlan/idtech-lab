---
- name: Install Sealed Secrets Controller
  hosts: k8s_master
  become: true

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    sealed_secrets_chart_version: "2.22.0"

  tasks:
    - name: Install Sealed Secrets using Helm
      kubernetes.core.helm:
        name: sealed-secrets
        chart_ref: sealed-secrets
        chart_repo_url: https://bitnami.github.io/sealed-secrets
        chart_version: "{{ sealed_secrets_chart_version }}"
        release_namespace: sealed-secrets
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        release_values:
          fullnameOverride: sealed-secrets-controller
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        wait: true
        timeout: 5m
        state: present
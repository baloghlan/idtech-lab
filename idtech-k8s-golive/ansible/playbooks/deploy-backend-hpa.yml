- name: Deploy Backend HPA
  hosts: k8s_master
  become: true

  vars:
    ansible_python_interpreter: /opt/ansible-k8s-venv/bin/python
    kubeconfig_path: /etc/kubernetes/admin.conf

  tasks:
    - name: Deploy Backend HorizontalPodAutoscaler
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('file', '../../k8s/backend/backend-hpa.yaml') | from_yaml }}"
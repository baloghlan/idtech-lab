- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure containerd
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Create local registry configuration directory
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ registry_host }}:{{ registry_port }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure local HTTP registry
  ansible.builtin.template:
    src: registry-hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ registry_host }}:{{ registry_port }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
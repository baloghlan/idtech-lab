apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-reporter
  namespace: idtech-backend
spec:
  selector:
    matchLabels:
      app: node-reporter

  template:
    metadata:
      labels:
        app: node-reporter

    spec:
      nodeSelector:
        kubernetes.io/os: linux

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values:
                      - frontend
                      - backend

      tolerations:
        - key: app
          operator: Equal
          value: frontend
          effect: NoSchedule

      containers:
        - name: node-reporter
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "Node: ${NODE_NAME} | Timestamp: $(date -u)"
                sleep 60
              done

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
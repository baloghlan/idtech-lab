apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intern-pod-reader
  namespace: idtech-backend
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intern-pod-reader-binding
  namespace: idtech-backend
subjects:
  - kind: User
    name: intern
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: intern-pod-reader
  apiGroup: rbac.authorization.k8s.io
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portal-healthcheck
  namespace: idtech-backend
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            tier: backend

          restartPolicy: OnFailure

          containers:
            - name: healthcheck
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  echo "Checking backend health..."
                  wget -q -T 10 -O - \
                    http://backend-svc.idtech-backend.svc.cluster.local/health

              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName

              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
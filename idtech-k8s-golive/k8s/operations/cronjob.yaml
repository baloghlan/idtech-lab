apiVersion: batch/v1
kind: CronJob
metadata:
  name: idtech-scheduled-job
  namespace: idtech-backend
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            tier: backend

          restartPolicy: OnFailure

          containers:
            - name: scheduled-job
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  echo "IDTECH scheduled job started"
                  echo "Timestamp: $(date -u)"
                  echo "Node: ${NODE_NAME}"
                  echo "IDTECH scheduled job completed"

              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName

              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idtech-backend
  annotations:
    kubernetes.io/change-cause: "Backend v1.0 - rollback after v1.1 rolling update"
spec:
  selector:
    matchLabels:
      app: backend

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        tier: backend

      initContainers:
        - name: wait-for-redis
          image: redis:7.4-alpine
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h "$REDIS_HOST" ping | grep -qx PONG; do
                echo "Waiting for Redis..."
                sleep 2
              done
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDIS_HOST
              value: redis-headless.idtech-backend.svc.cluster.local
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
        - name: backend
          image: 192.168.56.10:5000/idtech-backend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: redis-secret

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
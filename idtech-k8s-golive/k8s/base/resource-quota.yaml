apiVersion: v1
kind: ResourceQuota
metadata:
  name: frontend-quota
  namespace: idtech-frontend
spec:
  hard:
    pods: "2"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: backend-quota
  namespace: idtech-backend
spec:
  hard:
    pods: "15"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
input {
  file {
    path => "/var/log/elk-lab-direct/sample.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/elk-lab-sample.sincedb"
  }
  
  beats {
    host => "127.0.0.1"
    port => 5044
  }
}

filter {
  dissect {
    mapping => {
      "message" => "%{event_time} | %{[log][level]} | %{lab_message}"
    }
  }

  if [event_time] {
    date {
      match => ["event_time", "ISO8601"]
      target => "@timestamp"
      remove_field => ["event_time"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
    api_key => "${ES_API_KEY}"
    index => "elk-lab-%{+yyyy.MM.dd}"
    action => "create"
    data_stream => false
    manage_template => false
    ilm_enabled => false
  }
}
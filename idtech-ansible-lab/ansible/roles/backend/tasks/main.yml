- name: Create backend system user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create backend application directory
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0755"

- name: Deploy backend application
  ansible.builtin.copy:
    src: server.py
    dest: "{{ backend_app_dir }}/server.py"
    owner: "{{ backend_user }}"
    group: "{{ backend_user }}"
    mode: "0644"
  notify: Restart backend

- name: Deploy backend systemd service
  ansible.builtin.template:
    src: idtech-backend.service.j2
    dest: "/etc/systemd/system/{{ backend_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart backend

- name: Enable and start backend service
  ansible.builtin.systemd:
    name: "{{ backend_service_name }}"
    daemon_reload: true
    enabled: true
    state: started

- name: Check backend HTTP health
  ansible.builtin.uri:
    url: "http://{{ backend_bind_address }}:{{ backend_port }}/"
    method: GET
    status_code: 200
    return_content: true
  register: backend_health
  retries: 5
  delay: 2
  until: backend_health.status == 200
  changed_when: false

- name: Verify backend response
  ansible.builtin.assert:
    that:
      - backend_health.json.message == backend_message
      - backend_health.json.hostname == ansible_facts['hostname']
    fail_msg: "Backend response validation failed"
    success_msg: "Backend is healthy and returned the expected response"
  when: backend_health.status == 200
